<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IzoERP</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./style.css" />
  <script>
    // Tema aleasa se aplica inainte de primul paint: pusa in main.ts, pagina ar
    // clipi o data pe tema sistemului la fiecare incarcare.
    try {
      const t = localStorage.getItem("izorep-tema");
      if (t === "dark" || t === "light") document.documentElement.dataset.tema = t;
      // Acelasi motiv pentru bara laterala: pusa in main.ts, bara ar aparea
      // intinsa si s-ar plia sub ochii omului la fiecare incarcare.
      document.documentElement.dataset.meniu =
        localStorage.getItem("izorep-meniu") === "pliat" ? "pliat" : "extins";
    } catch { /* localStorage blocat: ramane tema sistemului, bara extinsa */ }
  </script>
</head>
<body>
  <button class="sari" id="sari">Sari la conținut</button>

  <div class="aplicatie">
    <!-- Pe ecran ingust bara e sertar peste continut: fundalul o inchide. -->
    <div class="fundal-sertar" id="fundal-sertar" hidden></div>

    <aside id="bara">
      <div class="marca">
        <strong>IzoERP</strong>
        <span>RADOIA ISOLIRUNG SRL</span>
      </div>
      <nav id="meniu" aria-label="Meniu principal"></nav>
      <div class="tema">
        <span class="tema-titlu" id="tema-titlu">Temă</span>
        <div class="tema-grup" id="tema" role="group" aria-labelledby="tema-titlu"></div>
      </div>
      <!-- Rolurile se stabilesc mai tarziu, cu firma (29 septembrie 2026): azi
           amandoua vad tot, deci comutatorul n-ar schimba nimic pe ecran. -->
      <div class="rol" hidden>
        <label for="rol">Rol activ</label>
        <select id="rol"></select>
      </div>
    </aside>

    <div class="continut">
      <header>
        <button type="button" class="pliaza" id="pliaza" aria-controls="bara" aria-expanded="true">
          <span id="pliaza-eticheta">Ascunde meniul</span>
        </button>
        <span class="antet-marca">IzoERP<span>RADOIA ISOLIRUNG</span></span>
        <div class="antet-dreapta">
          <!-- Cursul BNR al zilei, doar informativ: niciun calcul nu-l citeste. -->
          <span class="antet-curs" id="curs" hidden></span>
          <!-- Omul intrat: numele duce la „Contul meu”; „Ieși” închide sesiunea. -->
          <span class="antet-om" id="om" hidden></span>
        </div>
      </header>
      <!-- Ce spune serverul: o scriere refuzata, datele din browser de mutat. -->
      <div class="mesaje" id="mesaje" aria-live="polite"></div>
      <main id="ecran" tabindex="-1"></main>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
