name: Deploy demo pe GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un singur deploy odata; nu anulam unul in curs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Demo-ul include motorul de preturi. Daca suita pica, nu publicam:
      # o pagina care da alte preturi decat ofertele istorice e mai rea decat
      # nicio pagina.
      - name: Teste
        run: npm test

      - name: Build
        run: npm run build:web

      # enablement: true activeaza Pages pe sursa "GitHub Actions" direct din
      # workflow. Fara el, primul deploy pica pana cand cineva schimba manual
      # sursa din Settings -> Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
