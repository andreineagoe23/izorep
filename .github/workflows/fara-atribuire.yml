name: Fara atribuire AI

on:
  pull_request:
    branches: [main]

# Repo-ul nu poarta trailere de atribuire catre unelte AI. Verificarea e aici
# ca sa nu depinda de memoria nimanui.
jobs:
  verifica-commituri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cauta trailere de atribuire in commit-urile noi
        run: |
          gasit=0
          while read -r sha; do
            mesaj=$(git log -1 --format='%B' "$sha")
            if echo "$mesaj" | grep -qiE 'co-authored-by:.*(claude|anthropic|copilot|cursor)|generated with \[claude|🤖'; then
              echo "::error::Commit $sha contine trailer de atribuire AI"
              git log -1 --format='  %h %s' "$sha"
              gasit=1
            fi
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          if [ "$gasit" -eq 1 ]; then
            echo "Scoate trailerul: git rebase -i si editeaza mesajul, apoi push --force-with-lease"
            exit 1
          fi
          echo "Commit-urile sunt curate."
