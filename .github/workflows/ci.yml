name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Anuleaza rulari vechi pe acelasi branch cand se face push rapid.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    name: typecheck + teste
    runs-on: ubuntu-latest

    # Fara Postgres, testele de baza se SAR, iar CI-ul arata verde fara sa fi
    # verificat izolarea intre tenanti, imutabilitatea listelor sau
    # echivalenta catalogului. O suita care se sare arata exact ca una care
    # trece — de-aia baza ruleaza si aici, nu doar pe laptop.
    #
    # Versiunea majora si portul sunt aceleasi ca in docker-compose.yml.
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: izorep
          POSTGRES_PASSWORD: izorep
          POSTGRES_DB: izorep
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U izorep -d izorep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Pe server, ce se vede vine din baza: datele de exemplu din
      # web/date/seed.ts (clientii si sumele lor) nu au voie sa intre in pagina
      # construita pentru server (web/date/exemple.ts).
      - name: Pagina pentru server, fara datele de exemplu
        run: |
          npm run build:server
          if grep -rlE "Energoinstal|TRANSAVIA|Regina Maria|170519" dist-web; then
            echo "::error::Datele de exemplu din web/date/seed.ts au intrat in pagina pentru server."
            exit 1
          fi

      - name: Migrari si date
        run: npm run db:migrate && npm run db:seed

      # Suita reproduce oferte reale trimise clientilor. Daca pica, motorul
      # nu mai da aceleasi preturi ca ofertele istorice si nu se poate emite.
      - name: Teste
        env:
          IZOREP_CERE_BAZA: "1"
        run: npx vitest run --reporter=default --reporter=json --outputFile=teste.json

      # Fisierele clientilor (../attachments) nu sunt in repo, deci testele pe
      # ofertele semnate se sar aici (`cuClienti` din tests/conditii.ts): CI
      # verde nu inseamna ca ofertele semnate se reproduc — asta se vede doar
      # local. Pasul le numara la vedere. Orice alt test sarit e o eroare: o
      # baza care nu raspunde pica deja in teste (`IZOREP_CERE_BAZA`).
      - name: Ce nu a rulat in CI
        run: |
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("teste.json", "utf8"));
            const clienti = [], altele = [];
            for (const f of r.testResults) {
              const cuFisiere = /\b(cuClienti|areClienti)\b/.test(fs.readFileSync(f.name, "utf8"));
              for (const t of f.assertionResults)
                if (t.status !== "passed" && t.status !== "failed")
                  (cuFisiere ? clienti : altele).push(f.name.split("/tests/")[1] + ": " + t.title);
            }
            console.log(`Teste: ${r.numPassedTests} trecute, ${clienti.length} sarite fara fisierele clientilor`);
            if (clienti.length) console.log(`::warning::${clienti.length} teste pe ofertele semnate n-au rulat in CI (fisierele clientilor nu sunt in repo). Ruleaza npm test local.`);
            if (altele.length) {
              console.log("::error::Teste sarite din alt motiv decat fisierele clientilor:\n" + altele.join("\n"));
              process.exit(1);
            }
          '

  preturi-neschimbate:
    name: listele de preturi nu s-au schimbat accidental
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # data/price-lists/ e sursa de adevar pentru tarifare. Modificarea ei
      # schimba preturile din toate ofertele viitoare, deci trebuie sa fie o
      # decizie constienta, nu un efect secundar al altui commit.
      - name: Semnaleaza modificarile de preturi
        if: github.event_name == 'pull_request'
        run: |
          modificate=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- data/price-lists/)
          if [ -n "$modificate" ]; then
            echo "::warning::Acest PR modifica listele de preturi:"
            echo "$modificate" | sed 's/^/  /'
            echo "Confirma ca e intentionat si ca npm test inca trece pe ofertele istorice."
          else
            echo "Listele de preturi nu sunt atinse."
          fi
